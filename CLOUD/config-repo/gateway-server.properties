spring.application.name=gateway-server
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true


spring.cloud.gateway.server.webmvc.routes[0].id=ms-usuarios
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://MS-USUARIOS
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/usuarios/**


management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
